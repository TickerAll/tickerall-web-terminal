      /* ── MT5 MOBILE SHELL (Stage 1) — per-view contextual header + ☰ side-drawer +
         4-tab bottom nav. Replaces the persistent desktop toolbar with a header that
         changes per bottom-nav view, mirroring real MT5 mobile. Mobile-only. ── */

      /* contextual header (grid 'toolbar' row, 52px). NO overflow:hidden — the chart
         header's Indicators dropdown opens below it; the TF strip scrolls on its own. */
      #mt5[data-tier="mobile"] .m-head {
        grid-area:toolbar; display:flex; align-items:center; gap:10px; min-width:0;
        padding:0 8px; background:var(--panel); border-bottom:1px solid var(--line); }
      #mt5[data-tier="mobile"] .m-head-menu {
        flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
        background:none; border:0; color:var(--fg); font-size:21px; line-height:1; padding:0; }
      #mt5[data-tier="mobile"] .m-head-title { font-size:18px; font-weight:700; color:var(--fg); letter-spacing:.2px; }
      #mt5[data-tier="mobile"] .m-head-titlewrap { display:flex; flex-direction:column; min-width:0; flex:1; }
      #mt5[data-tier="mobile"] .m-head-sub { font-size:12px; font-weight:600; line-height:1.15; }
      #mt5[data-tier="mobile"] .m-head-sub.up { color:var(--up); }

      #mt5[data-tier="mobile"] .m-head-add {

      /* chart header: symbol + compact TF picker + indicators(icon) + New Order. The TF
         is a button+dropdown (not a wide strip) so the header never overflows a phone. */
      #mt5[data-tier="mobile"] .m-head-chart { gap:8px; }
      /* symbol = a tappable button → the symbol selector (Item 1) */
      #mt5[data-tier="mobile"] .m-head-sym {
        flex:none; display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 9px;
        background:var(--hover); border:1px solid var(--line2); border-radius:8px;
        font-weight:700; font-size:14px; color:var(--accent);
        max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      #mt5[data-tier="mobile"] .m-head-sym:disabled { opacity:.55; }
      #mt5[data-tier="mobile"] .m-head-spacer { flex:1 1 0; min-width:0; } /* pushes indicators + New Order right */
      #mt5[data-tier="mobile"] .m-head-chart .ind-menu, #mt5[data-tier="mobile"] .m-head-chart .neworder { flex:none; }
      /* Indicators → icon only on the chart header; dropdown stays on-screen */
      #mt5[data-tier="mobile"] .m-head-chart .ind-menu-label { display:none; }
      #mt5[data-tier="mobile"] .m-head-chart .ind-menu-btn { min-width:44px; min-height:44px; padding:0 9px; }
      #mt5[data-tier="mobile"] .ind-panel { left:auto; right:6px; width:min(280px, 92vw); }
      /* symbol caret + muted TF label (the TF is now changed by TAPPING the chart — Item 2) */
      #mt5[data-tier="mobile"] .m-head-caret { color:var(--muted); font-size:10px; }
      #mt5[data-tier="mobile"] .m-head-tf { flex:none; font-size:12px; font-weight:700; color:var(--muted); }
      /* on-chart RADIAL timeframe selector (Item 3): a circular dial toggled by a chart tap.
         Centered over the chart so it never clips; the current TF sits in the hub, the rest
         ring around it. Pick to switch + dismiss; tap the backdrop to close. */
      @keyframes m-tfradial-fade { from { opacity:0; } to { opacity:1; } }
      /* FAST SPIN-IN: the wheel whirls ~2.5 turns and decelerates to a stop while scaling +
         fading in; the labels spin WITH the ring and settle upright (the dial ends at rotate 0).
         A strong ease-out gives the "spun-to-a-stop" feel. */
      @keyframes m-tfradial-spin { from { opacity:0; transform:scale(.18) rotate(-900deg); } to { opacity:1; transform:scale(1) rotate(0deg); } }
      @keyframes m-tfradial-spin-out { from { opacity:1; transform:scale(1) rotate(0deg); } to { opacity:0; transform:scale(.45) rotate(220deg); } }
      #mt5[data-tier="mobile"] .m-tfradial-back { position:absolute; inset:0; z-index:9;
        display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.4);
        animation:m-tfradial-fade .14s ease both; }
      #mt5[data-tier="mobile"] .m-tfradial-back.closing { animation:m-tfradial-fade .15s ease reverse both; }
      #mt5[data-tier="mobile"] .m-tfradial { position:relative; width:248px; height:248px;
        animation:m-tfradial-spin .5s cubic-bezier(.12,.7,.22,1) both; }
      #mt5[data-tier="mobile"] .m-tfradial.closing { animation:m-tfradial-spin-out .15s ease-in both; }
      @media (prefers-reduced-motion: reduce) { #mt5[data-tier="mobile"] .m-tfradial { animation:m-tfradial-fade .15s ease both; } }
      #mt5[data-tier="mobile"] .m-tfradial-hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center;
        background:var(--panel); border:1px solid var(--line2); color:var(--accent); font-size:14px; font-weight:800;
        box-shadow:0 4px 16px var(--shadow); }
      #mt5[data-tier="mobile"] .m-tfradial-btn { position:absolute; transform:translate(-50%,-50%);
        width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
        background:var(--panel); border:1px solid var(--line2); color:var(--fg); font-size:13px; font-weight:700;
        box-shadow:0 4px 14px var(--shadow); transition:background .15s, border-color .15s, color .15s; }
      #mt5[data-tier="mobile"] .m-tfradial-btn.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

      /* draw-mode dismiss scrim (Item 4): covers the chart (below the .dtb toolbar + ✓ Done);

      #mt5[data-tier="mobile"] .m-draw-scrim { position:absolute; inset:0; z-index:5; background:transparent; }

      #mt5[data-tier="mobile"] .m-drawer {

        background:var(--hover); border:1px solid var(--line2); color:var(--fg); border-radius:8px; font-size:17px; line-height:1; }
      #mt5[data-tier="mobile"] .m-layout-btn.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

      /* full-screen sheet (Journal / Alerts) — its own header w/ a back chevron */
      #mt5[data-tier="mobile"] .m-sheet {

      /* add-symbol picker sheet (Quotes +): search box over a tappable candidate list */
      #mt5[data-tier="mobile"] .m-pick-search { flex:none; padding:10px 12px; border-bottom:1px solid var(--line); }
      #mt5[data-tier="mobile"] .m-pick-search input { width:100%; background:var(--panel2); border:1px solid var(--line);
        color:var(--fg); border-radius:8px; padding:11px 12px; font-size:16px; }
      #mt5[data-tier="mobile"] .m-pick-search input:focus { outline:none; border-color:var(--accent); }
      #mt5[data-tier="mobile"] .m-pick-list { flex:1 1 0; min-height:0; overflow-y:auto; }

      /* switch mode = a compact bottom SHEET (a quick instrument swap, not the whole screen) */
      #mt5[data-tier="mobile"] .m-pick-back { position:fixed; inset:0; z-index:56; background:var(--backdrop);
        display:flex; align-items:flex-end; }

        background:var(--panel); border-top:1px solid var(--line2); border-radius:14px 14px 0 0; overflow:hidden;
        padding-bottom:env(safe-area-inset-bottom); }

      #mt5[data-tier="mobile"] .m-empty { padding:24px 18px; color:var(--muted); text-align:center; font-size:13px; }

      /* one-tap SELL/BUY band — pinned at the bottom of the chart view, above the nav.

      #mt5[data-tier="mobile"] .m-band { display:flex; align-items:stretch; flex:none; height:46px;

      #mt5[data-tier="mobile"] .m-trade::-webkit-scrollbar, #mt5[data-tier="mobile"] .m-quotes::-webkit-scrollbar,

      #mt5[data-tier="mobile"] .m-acct-v { color:var(--fg); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }

      #mt5[data-tier="mobile"] .m-sec { display:flex; align-items:center; padding:8px 16px; background:var(--surface);

      /* shared position / deal rows */
      #mt5[data-tier="mobile"] .m-row { display:flex; align-items:center; gap:10px; padding:11px 16px;

      #mt5[data-tier="mobile"] .m-row-x { flex:none; width:36px; height:36px; border-radius:8px; background:none;
        border:0; color:var(--muted); font-size:13px; }
      #mt5[data-tier="mobile"] .m-row-x:hover { background:var(--hover); color:var(--down); }

      /* swipeable position row (Item 5): swipe LEFT to reveal Modify; the ✕ stays visible.
         The track is opaque so it covers the revealed ✎ at rest; pan-y lets the list scroll. */
      #mt5[data-tier="mobile"] .m-posrow { display:flex; align-items:stretch; border-bottom:1px solid var(--row-line); }
      #mt5[data-tier="mobile"] .m-posrow-swipe { flex:1 1 auto; min-width:0; position:relative; overflow:hidden; }
      #mt5[data-tier="mobile"] .m-posrow-modify { position:absolute; top:0; right:0; bottom:0; width:58px;
        display:flex; align-items:center; justify-content:center; background:var(--accent); color:var(--on-accent);
        border:0; font-size:18px; z-index:1; }
      #mt5[data-tier="mobile"] .m-posrow-track { position:relative; z-index:2; min-height:100%; display:flex;
        align-items:center; gap:10px; padding:11px 11px 11px 16px; background:var(--bg); touch-action:pan-y; will-change:transform; }
      #mt5[data-tier="mobile"] .m-posrow-track:active { background:var(--row-hover); }
      /* The P&L (end of the track) sits nearer the × now: smaller track right-padding + a narrower
         × whose glyph hugs the left, so the floating P&L and the close button read as a pair (#18). */
      #mt5[data-tier="mobile"] .m-posrow-x { flex:none; width:44px; background:none; border:0; color:var(--muted); font-size:14px;
        display:flex; align-items:center; justify-content:flex-start; padding-left:4px; }
      #mt5[data-tier="mobile"] .m-posrow-x:active { color:var(--down); background:var(--hover); }

      /* long-press position action menu (Item 7) — a bottom sheet (same actions as the swipe) */
      #mt5[data-tier="mobile"] .m-actions-back { position:fixed; inset:0; z-index:55; background:var(--backdrop);
        display:flex; align-items:flex-end; }
      #mt5[data-tier="mobile"] .m-actions { width:100%; background:var(--panel); border-top:1px solid var(--line2);
        border-radius:14px 14px 0 0; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
      #mt5[data-tier="mobile"] .m-actions-h { padding:12px 12px 10px; font-size:15px; color:var(--fg);
        border-bottom:1px solid var(--line); margin-bottom:6px; }
      #mt5[data-tier="mobile"] .m-actions-item { display:block; width:100%; text-align:left; background:none; border:0;
        color:var(--fg); font-size:15px; padding:14px 12px; border-radius:8px; }
      #mt5[data-tier="mobile"] .m-actions-item:active { background:var(--hover); }
      #mt5[data-tier="mobile"] .m-actions-danger { color:var(--down); }
      #mt5[data-tier="mobile"] .m-actions-cancel { display:block; width:100%; margin-top:6px; background:var(--hover);
        border:1px solid var(--line2); color:var(--fg); font-size:15px; font-weight:700; padding:14px; border-radius:10px; }

      /* quotes rows */
      /* Watchlist row = a swipe-left-to-remove track (#17). The row (.m-q) slides over a red
         Remove button revealed on its right; tapping the row charts, swiping reveals Remove. */
      #mt5[data-tier="mobile"] .m-q-row { position:relative; border-bottom:1px solid var(--row-line); overflow:hidden; }
      #mt5[data-tier="mobile"] .m-q-del { position:absolute; top:0; right:0; bottom:0; width:84px; z-index:1;
        display:flex; align-items:center; justify-content:center; gap:3px; background:var(--down); color:#fff;
        border:0; font-size:12px; font-weight:700; cursor:pointer; }
      #mt5[data-tier="mobile"] .m-q { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:10px 16px; background:var(--bg); cursor:pointer; touch-action:pan-y; will-change:transform; }
      #mt5[data-tier="mobile"] .m-q.on { background:var(--sel); }
      #mt5[data-tier="mobile"] .m-q-l { min-width:0; }
      #mt5[data-tier="mobile"] .m-q-sym { font-size:15px; font-weight:700; color:var(--fg); }
      #mt5[data-tier="mobile"] .m-q-time { font-size:11px; color:var(--muted); margin-top:3px; }
      #mt5[data-tier="mobile"] .m-q-r { display:flex; gap:16px; flex:none; }
      #mt5[data-tier="mobile"] .m-q-px { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--fg); white-space:nowrap; }
      #mt5[data-tier="mobile"] .m-q-px.up { color:var(--up); }
      #mt5[data-tier="mobile"] .m-q-px.down { color:var(--down); }

      /* History period dropdown — lives IN the header, pushed to the right of the title (Item 6) */
      #mt5[data-tier="mobile"] .m-head-period { position:relative; margin-left:auto; flex:none; }
      #mt5[data-tier="mobile"] .m-head-pbtn { min-height:44px; padding:0 12px; font-size:13px; font-weight:700;
        background:var(--hover); border:1px solid var(--line2); color:var(--fg); border-radius:8px;
        display:inline-flex; align-items:center; gap:5px; }
      #mt5[data-tier="mobile"] .m-head-pmenu { position:absolute; top:calc(100% + 6px); right:0; z-index:20;
        min-width:200px; background:var(--panel); border:1px solid var(--line2); border-radius:10px;
        box-shadow:0 10px 28px var(--shadow); overflow:hidden; }
      #mt5[data-tier="mobile"] .m-head-pmenu button { display:block; width:100%; text-align:left; background:none;
        border:0; color:var(--fg); padding:13px 14px; font-size:14px; }
      #mt5[data-tier="mobile"] .m-head-pmenu button.on { color:var(--accent); font-weight:600; }
      #mt5[data-tier="mobile"] .m-head-pmenu button:hover { background:var(--hover); }
      /* history sub-tabs */
      #mt5[data-tier="mobile"] .m-hist-tabs { display:flex; border-bottom:1px solid var(--line); }
      #mt5[data-tier="mobile"] .m-hist-tabs button { flex:1; min-height:44px; background:none; border:0;
        border-bottom:2px solid transparent; color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.3px; }
      #mt5[data-tier="mobile"] .m-hist-tabs button.on { color:var(--fg); border-bottom-color:var(--accent); }
      #mt5[data-tier="mobile"] .m-hist-sum { border-bottom:1px solid var(--line); }

      /* dedicated account view (Item 2) — a focused sheet of the active account's details */
      #mt5[data-tier="mobile"] .m-acctview { flex:1 1 0; min-height:0; overflow-y:auto; }
      #mt5[data-tier="mobile"] .m-acctview-hero { padding:18px 16px 14px; border-bottom:1px solid var(--line); }
      #mt5[data-tier="mobile"] .m-acctview-name { font-size:20px; font-weight:700; color:var(--fg); }
      #mt5[data-tier="mobile"] .m-acctview-sub { font-size:13px; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums; }
      #mt5[data-tier="mobile"] .m-acctview-sec { padding:14px 16px 6px; font-size:11px; text-transform:uppercase;
        letter-spacing:.6px; color:var(--muted); font-weight:600; }
      #mt5[data-tier="mobile"] .m-acctview-row { display:flex; align-items:baseline; justify-content:space-between;
        gap:12px; padding:11px 16px; border-bottom:1px solid var(--row-line); }
      #mt5[data-tier="mobile"] .m-acctview-k { font-size:14px; color:var(--muted); flex:none; }
      #mt5[data-tier="mobile"] .m-acctview-v { font-size:15px; font-weight:600; color:var(--fg);
        font-variant-numeric:tabular-nums; text-align:right; word-break:break-word; }
      /* per-state status dot (Item 1a): green=connected, amber=connecting, red=cold */
      #mt5[data-tier="mobile"] .m-acctview-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
        margin:0 5px 0 8px; vertical-align:middle; background:var(--muted); }
      #mt5[data-tier="mobile"] .m-acctview-dot-connected { background:var(--green); box-shadow:0 0 6px var(--green-glow); }
      #mt5[data-tier="mobile"] .m-acctview-dot-connecting { background:var(--amber); }
      #mt5[data-tier="mobile"] .m-acctview-dot-cold { background:var(--down); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="renderer.js"></script>
  </body>
</html>
