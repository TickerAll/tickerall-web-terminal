<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:" />
    <title>TickerAll Terminal</title>
    <link rel="stylesheet" href="renderer.css" />  <!-- the renderer's bundled CSS (emitted by esbuild) -->
    <style>
      /* Theme tokens (Foundation 2). These defaults are the EXACT colours that were
         hardcoded before the variable-ize pass, so the dark theme renders pixel-
         identical even before React/ThemeProvider mounts. The ThemeProvider overrides
         every one of these on <html> via style.setProperty when a theme is active.
         Var names mirror src/renderer/theme/tokens.ts (`rowLine` → `--row-line`). */
      :root {
        /* core surfaces & text */
        --bg:#0e1116; --panel:#11161d; --panel2:#0d1117; --line:#1d2530; --line2:#28323f;
        --fg:#c9d1d9; --muted:#7d8590; --accent:#2f81f7; --up:#26a69a; --down:#ef5350; --gold:#f0b90b;
        /* extra surfaces from the variable-ize pass */
        --on-accent:#fff; --hover:#161d27; --sel:#16202c; --row-line:#131a22; --row-hover:#131a22;
        --surface:#0f141b; --acct-active:#101822; --input-ro:#0c1014; --line-hover:#2f3b49;
        --google-fg:#1f1f1f; --shadow:#000a; --backdrop:#0008; --chart-loading-bg:rgba(14,17,22,0.92);
        /* green accent family */
        --green:#3fb950; --green-glow:#3fb95088; --green-bg:#12331f; --green-line:#1c4a2c; --green-bg-hover:#163e25;
        --amber:#d29922;
        /* connecting pill */
        --pill-fg:#9cc4ff; --pill-bg:#11233f; --pill-line:#1d3a63;
        /* chart colours (also set on the LWC canvas via chartTheme.ts) */
        --chart-bg:#0e1116; --scale-text:#9aa4b2; --grid:#161d27; --scale-border:#222b36;
        --up-body:#26a69a; --down-body:#ef5350; --wick:#26a69a; --candle-border:transparent;
        --watermark:rgba(124,133,144,0.10);
        --equity-bg:#0d1117; --equity-text:#7d8590; --equity-line:#2f81f7; --balance-line:#7d8590;
        /* skin chrome (overridden by .theme-8bit / .theme-16bit) */
        --skin-font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --skin-border-width: 1px;
        --skin-radius-mult: 1;
      }
      * { box-sizing: border-box; }
      html, body, #root { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
        font:12.5px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .center { display:flex; align-items:center; justify-content:center; height:100vh; height:100dvh; }
      .muted { color:var(--muted); } .tiny { font-size:11px; }
      .up { color:var(--up); } .down { color:var(--down); }
      .num { text-align:right; font-variant-numeric:tabular-nums; }
      .sym { font-weight:600; }
      button { cursor:pointer; font-family:inherit; }
      button:disabled { opacity:.45; cursor:default; }
      input, select { font-family:inherit; }
      .linkbtn { background:none; border:0; color:var(--accent); font-size:11px; padding:0; }
      .linkbtn:hover { text-decoration:underline; }
      .iconbtn { background:none; border:0; color:var(--muted); font-size:15px; line-height:1; padding:0 4px; }
      .iconbtn:hover { color:var(--fg); }
      .primary { background:var(--accent); border:0; color:var(--on-accent); font-weight:600; border-radius:6px; padding:9px; }
      .primary.sm { padding:7px 12px; font-size:12px; }
      .danger { background:var(--down); border:0; color:#fff; font-weight:600; border-radius:6px; padding:9px; cursor:pointer; }
      .danger.sm { padding:7px 12px; font-size:12px; }
      .rm { background:none; border:0; color:var(--muted); font-size:14px; line-height:1; padding:0 4px; visibility:hidden; }
      tr:hover .rm, .nav-acct-row:hover .rm { visibility:visible; }
      .rm:hover { color:var(--down); }
      /* Remove-from-roster trash on each account row — hover-reveal on desktop like .rm,
         always-visible on mobile (set below); muted → down (destructive) on hover. */
      .nav-rm-acct { background:none; border:0; color:var(--muted); padding:0 3px; cursor:pointer; visibility:hidden; display:inline-flex; align-items:center; }
      .nav-acct-row:hover .nav-rm-acct { visibility:visible; }
      .nav-rm-acct:hover { color:var(--down); }
      .nav-confirm-rm { padding:8px 10px 10px; background:var(--panel2); }
      .chk { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; margin:6px 0; }
      .chk input { width:auto; }

      /* ── Login (unchanged) ── */
      .login { display:flex; align-items:center; justify-content:center; height:100vh; height:100dvh; }
      .login .card { width:min(340px, calc(100vw - 24px)); box-sizing:border-box; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px 26px; }
      .login h1 { font-size:20px; margin:0 0 4px; letter-spacing:.3px; }
      .login h1 span { color:var(--accent); }
      .login p.sub { color:var(--muted); margin:0 0 22px; font-size:12.5px; }
      .login label { display:block; color:var(--muted); margin:12px 0 4px; font-size:11px; }
      .login input { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:9px 10px; font-size:13px; }
      .login input:focus { outline:none; border-color:var(--accent); }
      .login .primary { width:100%; margin-top:18px; }
      .login .or { text-align:center; color:var(--muted); font-size:11px; margin:16px 0; position:relative; }
      .login .or::before, .login .or::after { content:""; position:absolute; top:50%; width:38%; height:1px; background:var(--line); }
      .login .or::before { left:0; } .login .or::after { right:0; }
      .login .google { width:100%; background:var(--on-accent); color:var(--google-fg); border:0; border-radius:7px; padding:10px; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; gap:9px; }
      .login .err { color:var(--down); font-size:12px; margin-top:14px; min-height:1em; }

      /* ── MT5 shell ── */
      /* height:100dvh (dynamic viewport) tracks the VISIBLE area as the mobile URL bar
         shows/hides, so the last grid row (the bottom-nav on mobile) stays in view —
         plain 100vh is the LARGE viewport (taller than visible) and overflow:hidden then
         strands the nav below the fold. Desktop Electron has no URL bar → dvh == 100vh,
         so this is a no-op there. */
      #mt5 { display:grid; grid-template-columns:272px 1fr; grid-template-rows:42px 1fr 212px;
        grid-template-areas:"toolbar toolbar" "left chart" "left toolbox"; height:100vh; height:100dvh; overflow:hidden; }

      .toolbar { grid-area:toolbar; display:flex; align-items:center; gap:14px; padding:0 12px;
        background:var(--panel); border-bottom:1px solid var(--line); }
      .toolbar .tb-left { display:flex; align-items:baseline; gap:12px; min-width:0; flex:0 1 auto; }
      /* Default (unbranded) wordmark: TICKER + an [ALL!] pill — the built-in house logo, which a
         partner host replaces at runtime (see branding.ts / BrandLogo). Reset the <button> chrome
         so it reads as text; reuse --skin-font so it's the pixel face under the 8-bit/16-bit skins
         and the normal font elsewhere. Doubles as the "back to home" link. */
      .toolbar .logo { font-size:13px; letter-spacing:.3px; display:inline-flex; align-items:center; gap:5px;
        background:none; border:0; padding:0; margin:0; color:var(--fg); cursor:pointer; font-family:var(--skin-font); line-height:1; }
      .toolbar .logo .logo-word { font-weight:700; letter-spacing:.5px; }
      .toolbar .logo .logo-pill { color:var(--accent); border:1.5px solid var(--accent); border-radius:4px;
        padding:1px 4px; font-weight:700; font-size:.8em; letter-spacing:.5px; line-height:1; }
      /* Partner-branded logotype (host-injected data: URI, see branding.ts) — replaces the
         text wordmark; sized to sit in the toolbar without stretching. */
      .toolbar .logo .logo-img { height:18px; width:auto; max-height:22px; display:block; object-fit:contain; }
      .toolbar .logo:hover .logo-word { color:var(--accent); }
      .toolbar .logo:hover .logo-pill { background:var(--accent); color:var(--on-accent); }
      .toolbar .active-sym { font-weight:700; font-size:13px; color:var(--accent); padding:2px 9px; border:1px solid var(--line2); border-radius:6px; background:var(--panel2); letter-spacing:.2px;
        flex:none; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      /* The timeframe strip is the toolbar's elastic zone: it shrinks and scrolls (hidden
         scrollbar) so the right-hand action cluster is NEVER pushed off-screen at narrow
         widths. The tb-left (logo/symbol) also shrinks; tb-right stays fixed-size. */
      .tf-bar { display:flex; gap:2px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; }
      .tf-bar::-webkit-scrollbar { display:none; }
      .tf { flex:none; white-space:nowrap; background:transparent; border:1px solid transparent; color:var(--muted); border-radius:5px; padding:4px 8px; font-size:11px; font-weight:600; }
      .tf:hover:not(:disabled) { color:var(--fg); background:var(--hover); }
      .tf.on { color:var(--on-accent); background:var(--accent); }
      .tb-right { display:flex; align-items:center; gap:12px; margin-left:auto; flex:none; }
      /* Screen-size preview control (web only; TierToggle "bar" variant) — segmented icon
         group in the toolbar's right cluster on desktop/tablet. (Mobile uses the ☰ drawer.) */
      .tier-seg { display:inline-flex; align-items:center; gap:1px; flex:none; padding:2px;
        border:1px solid var(--line2); border-radius:7px; background:var(--panel2); }
      .tier-seg-btn { display:inline-flex; align-items:center; justify-content:center;
        width:26px; height:24px; padding:0; border:0; border-radius:5px; cursor:pointer;
        background:transparent; color:var(--muted); }
      .tier-seg-btn:hover { color:var(--fg); background:var(--hover); }
      .tier-seg-btn.on { color:var(--on-accent); background:var(--accent); }
      /* Account control: an initials avatar that opens a dropdown (identity + Settings /
         Home / Sign out). Replaces the old "<email> · sign out" text. */
      .usermenu { position:relative; display:inline-flex; }
      .usermenu-avatar { width:28px; height:28px; border-radius:50%; border:1px solid var(--line2); background:var(--accent);
        color:var(--on-accent); font-size:11px; font-weight:700; letter-spacing:.3px; cursor:pointer;
        display:inline-flex; align-items:center; justify-content:center; padding:0; }
      .usermenu-avatar:hover { filter:brightness(1.08); }
      .usermenu-pop { position:absolute; top:calc(100% + 6px); right:0; z-index:50; min-width:208px; max-width:260px;
        background:var(--panel); border:1px solid var(--line2); border-radius:8px; box-shadow:0 8px 24px var(--shadow);
        padding:6px; display:flex; flex-direction:column; gap:2px; }
      .usermenu-id { padding:5px 9px 8px; border-bottom:1px solid var(--line); margin-bottom:4px; }
      .usermenu-name { font-size:12.5px; font-weight:700; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .usermenu-email { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .usermenu-item { text-align:left; background:none; border:0; color:var(--fg); font-size:12.5px; padding:7px 9px; border-radius:6px; cursor:pointer; }
      .usermenu-item:hover { background:var(--hover); }
      .usermenu-danger { color:var(--down); }
      .usermenu-div { height:1px; background:var(--line); margin:4px 2px; }
      .neworder { background:var(--green-bg); color:var(--green); border:1px solid var(--green-line); border-radius:6px; padding:6px 14px; font-weight:600; font-size:12px; }
      .neworder:hover:not(:disabled) { background:var(--green-bg-hover); }

      .left { grid-area:left; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line); min-height:0; }
      .panel-h { display:flex; align-items:center; justify-content:space-between; padding:7px 10px;
        font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted);
        background:var(--surface); border-bottom:1px solid var(--line); }
      .panel-h.sub { background:transparent; }

      /* Market Watch */
      .mw { flex:1.25 1 0; display:flex; flex-direction:column; min-height:0; border-bottom:1px solid var(--line); }
      .mw-tabs { display:flex; gap:2px; padding:4px 6px; overflow-x:auto; border-bottom:1px solid var(--line); }
      .mw-tab { background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:5px; padding:3px 8px; font-size:11px; white-space:nowrap; }
      .mw-tab.on { color:var(--on-accent); border-color:var(--accent); }
      .mw-table { width:100%; border-collapse:collapse; flex:1; display:block; overflow:auto; min-height:0; }
      .mw-table thead, .mw-table tbody { display:table; width:100%; table-layout:fixed; }
      .mw-table thead { position:sticky; top:0; background:var(--panel); }
      .mw-table th { text-align:left; color:var(--muted); font-weight:500; font-size:10.5px; padding:4px 8px; border-bottom:1px solid var(--line); }
      .mw-table th.num { text-align:right; }
      .mw-table td { padding:4px 8px; border-bottom:1px solid var(--row-line); }
      .mw-table tr { cursor:pointer; }
      .mw-table tbody tr:hover { background:var(--row-hover); }
      .mw-table tr.sel { background:var(--sel); }
      .mw-table td.x { width:22px; text-align:center; }
      .mw-add { padding:6px; border-bottom:1px solid var(--line); }
      .mw-add input { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 8px; font-size:12px; }
      .mw-cands { max-height:160px; overflow:auto; margin-top:4px; }
      .mw-cand { padding:5px 8px; cursor:pointer; border-radius:4px; }
      .mw-cand:hover { background:var(--sel); }

      /* Navigator */
      .nav { flex:1 1 0; display:flex; flex-direction:column; min-height:0; }
      .nav-list { overflow:auto; flex:1; min-height:0; }
      .nav-acct { border-bottom:1px solid var(--row-line); }
      .nav-acct.active { background:var(--acct-active); }
      .nav-acct-row { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; }
      .nav-acct-row:hover { background:var(--row-hover); }
      .nav-acct-info { flex:1; min-width:0; }
      .nav-acct-srv { font-weight:600; font-size:12px; }
      .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--muted); }
      .dot.live { background:var(--green); box-shadow:0 0 6px var(--green-glow); }
      .dot.ready { background:var(--accent); }
      .dot.offline { background:var(--amber); }
      .dot.rejected { background:var(--down); }
      .connect-hint { color:var(--accent); }
      .spinner { display:inline-block; width:9px; height:9px; border:1.5px solid var(--line2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
      .dot.connecting { background:var(--accent); animation:pulse 1s ease-in-out infinite; }
      .connecting-text { display:inline-flex; align-items:center; gap:5px; color:var(--accent); white-space:nowrap; }
      .connecting-pill { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--pill-fg); background:var(--pill-bg); border:1px solid var(--pill-line); border-radius:999px; padding:3px 10px; }
      .connecting-pill .spinner, .connecting-text .spinner { width:8px; height:8px; }
      .nav-pwd { padding:8px 10px 10px; background:var(--panel2); }
      .nav-pwd input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:12px; }
      .nav-pwd input.readonly-num { color:var(--muted); background:var(--input-ro); cursor:default; font-variant-numeric:tabular-nums; letter-spacing:1px; }
      .nav-pwd-actions { display:flex; align-items:center; gap:10px; }
      .forget { display:block; padding:0 10px 8px; }
      .nav-err { color:var(--down); padding:6px 10px; }
      .nav-new { padding:8px 10px; border-top:1px solid var(--line); background:var(--panel2); }
      .nav-new .row { display:grid; grid-template-columns:84px 1fr; gap:6px; margin-bottom:6px; }
      .nav-new input, .nav-new select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:12px; }
      .nav-add { display:block; padding:9px 10px; text-align:left; border-top:1px solid var(--line); }

      /* Chart (+ editor split) */
      .chart-area { grid-area:chart; background:var(--bg); display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
      /* Sidebar collapse pull-tab (#13): a handle on the chart's LEFT edge (the sidebar
         boundary). ALWAYS visible + tinted with the theme's --accent so it can't be missed AND
         actually re-tints per theme (--gold was a yellow on every theme; --accent is the token
         that varies across the spectrum — blue / teal / red / azure / green / gold per theme). */
      .sidebar-pull { position:absolute; left:0; top:50%; transform:translateY(-50%); z-index:6;
        width:17px; height:58px; padding:0; display:flex; align-items:center; justify-content:center;
        background:var(--panel); color:var(--accent); border:1px solid var(--accent); border-left:0;
        border-radius:0 8px 8px 0; cursor:pointer; font-size:15px; font-weight:700; box-shadow:2px 0 8px var(--shadow);
        transition:background .12s, color .12s; }
      .sidebar-pull:hover { background:var(--accent); color:var(--on-accent); }
      .chart-body { position:relative; display:flex; flex:1 1 0; min-width:0; min-height:0; }
      /* .chart-pane is a flex column: the chart (+ its absolute overlays) on top in
         .chart-main, the indicator oscillator stack beneath. */
      .chart-pane { position:relative; flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
      .chart-main { position:relative; flex:1 1 0; min-width:0; min-height:0; }

      /* Big-price overlay — a draggable on-chart card (Item 13 redesign; no longer a
         strip that shrinks the chart). */
      .big-price { position:absolute; z-index:5; min-width:148px; padding:8px 12px 10px; cursor:grab;
        background:var(--chart-loading-bg); border:1px solid var(--line2); border-radius:9px;
        box-shadow:0 6px 20px var(--shadow); user-select:none; }
      .big-price:active { cursor:grabbing; }
      .big-price .bp-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .big-price .bp-sym { font-size:12px; font-weight:700; color:var(--fg); letter-spacing:.3px; }
      .big-price .bp-x { background:none; border:0; color:var(--muted); font-size:14px; line-height:1; padding:0 2px; }
      .big-price .bp-x:hover { color:var(--down); }
      .big-price .bp-main { font-size:30px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--fg); }
      .big-price.up .bp-main { color:var(--up); }
      .big-price.down .bp-main { color:var(--down); }
      .big-price .bp-side { display:flex; gap:14px; font-size:11px; color:var(--fg); font-variant-numeric:tabular-nums; margin-top:2px; }
      .big-price .bp-side .bp-k { color:var(--muted); text-transform:uppercase; font-size:9px; letter-spacing:.4px; margin-right:3px; }

      /* Log/linear price-scale toggle (Item 7) — bottom-right corner of the chart. */
      /* touch-action:manipulation is load-bearing on mobile: this button sits OVER the
         lightweight-charts pane, whose touch handlers (+ the drawing layer's pane-level
         pointerdown) otherwise claim the tap as a pan/draw gesture so the click never
         synthesises. `manipulation` tells the browser this element owns its taps. */
      .scale-toggle { position:absolute; right:6px; bottom:6px; z-index:5; background:var(--chart-loading-bg);
        border:1px solid var(--line2); color:var(--muted); border-radius:5px; font-size:10px; font-weight:600;
        text-transform:uppercase; letter-spacing:.5px; padding:3px 7px; cursor:pointer; touch-action:manipulation; }
      .scale-toggle:hover { color:var(--fg); border-color:var(--line-hover); }
      /* On the mobile Charts view nest the log/linear toggle in the chart's bottom-right
         GUTTER CORNER — the dead intersection where the right price-axis gutter meets the
         bottom time-axis gutter, below the lowest price label, just above the 46px one-tap
         trade band (which sits BELOW the chart, not over it — measured: chart-main bottom ==
         band top, so a small `bottom` puts the pill right at the corner, #25). Earlier the
         +46px assumed the band overlaid the chart and floated the pill up over a price label.
         z-index:7 keeps it above the drawing canvas (z3) + dismiss scrim (z5) so a tap lands
         on it (#21), while staying BELOW the non-chart .m-overlay (z8) + TF radial backdrop
         (z9) so it never pokes through them (#23). */
      #mt5[data-tier="mobile"] .scale-toggle { bottom:3px; right:5px; padding:6px 11px; font-size:12px; z-index:7; }
      /* …and the always-mounted chart carries the toggle even when another view is on top, so
         show it ONLY on the Charts view, and NOT while the TF radial dial is open (z9 — they'd
         fight for the same corner). Hidden on Quotes/Trade/History + during TF selection (#23). */
      #mt5[data-tier="mobile"]:not([data-mview="chart"]) .scale-toggle,
      #mt5[data-tier="mobile"][data-tfopen="1"] .scale-toggle { display:none; }
      .chart { position:absolute; inset:0; }
      /* z-index above lightweight-charts' own canvases (they set z-index) + a solid ground, so the
         empty pane's bare axes never show through the card (the phone first-run showed a blank
         chart with a dark right-hand column instead of this card, 2026-09-18). */
      .chart-empty { position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center;
        pointer-events:none; background:var(--bg); padding:0 20px; text-align:center; }
      .chart-empty-card { text-align:center; } .chart-empty-card h3 { margin:0 0 6px; font-weight:600; }
      /* the empty-chart connect CTA — .chart-empty is pointer-events:none, so re-enable the button */
      .chart-empty-cta { pointer-events:auto; margin-top:14px; }
      #mt5[data-tier="mobile"] .chart-empty-cta { min-height:46px; padding:0 18px; font-size:14px; }
      .chart-loading { position:absolute; top:10px; right:14px; z-index:5; display:flex; align-items:center; gap:7px; padding:5px 11px; background:var(--chart-loading-bg); border:1px solid var(--line2); border-radius:6px; color:var(--fg); font-size:11px; pointer-events:none; }
      .chart-loading .spinner { width:11px; height:11px; border:2px solid var(--line2); border-top-color:var(--accent); border-radius:50%; animation:cl-spin .7s linear infinite; }
      @keyframes cl-spin { to { transform:rotate(360deg); } }

      /* Chart tabs (multi-symbol, pinnable) — a TradingView-style strip atop the chart
         area; the right end carries the chart maximize/restore toggle. */
      .chart-tabs { display:flex; align-items:stretch; height:30px; flex:none;
        background:var(--panel); border-bottom:1px solid var(--line); }
      .chart-tabs-scroll { display:flex; align-items:stretch; overflow-x:auto; flex:1; min-width:0; }
      .ctab { display:flex; align-items:center; gap:6px; padding:0 9px; border-right:1px solid var(--line);
        color:var(--muted); cursor:pointer; white-space:nowrap; font-size:11.5px; max-width:210px;
        touch-action:pan-x; /* horizontal swipe scrolls the strip; a vertical drag docks the tab (touch) */ }
      .ctab:hover { background:var(--hover); }
      .ctab.on { color:var(--fg); background:var(--bg); box-shadow:inset 0 -2px 0 var(--accent); }
      .ctab-sym { font-weight:600; overflow:hidden; text-overflow:ellipsis; }
      /* On-canvas indicator (multi-chart layout): filled = tab is shown as a pane, hollow =
         strip-only (drag it onto a chart to show it). */
      .ctab-dot { flex:none; width:6px; height:6px; border-radius:50%; border:1px solid var(--muted); box-sizing:border-box; }
      .ctab.shown .ctab-dot { background:var(--accent); border-color:var(--accent); }
      .ctab-tf { color:var(--muted); font-size:10px; }
      .ctab.on .ctab-tf { color:var(--accent); }
      .ctab-pin { background:none; border:0; color:var(--muted); font-size:11px; line-height:1; padding:0; }
      .ctab.pinned .ctab-pin, .ctab-pin:hover { color:var(--gold); }
      .ctab-x { background:none; border:0; color:var(--muted); font-size:13px; line-height:1; padding:0 2px; visibility:hidden; }
      .ctab:hover .ctab-x, .ctab.on .ctab-x { visibility:visible; }
      .ctab-x:hover { color:var(--down); }
      .ctab-max { flex:none; background:none; border:0; border-left:1px solid var(--line); color:var(--muted);
        font-size:14px; padding:0 11px; }
      .ctab-max:hover { color:var(--fg); background:var(--hover); }
      .ctab-add { flex:none; align-self:center; background:none; border:0; color:var(--muted); font-size:13px; line-height:1; padding:0 11px; }
      .ctab-add:hover { color:var(--accent); }

      /* Chart-tabs layout switcher (single / side-by-side / stacked / grid) */
      .ctab-layout { display:flex; align-items:stretch; flex:none; border-left:1px solid var(--line); }
      .ctab-lay { background:none; border:0; color:var(--muted); font-size:13px; padding:0 7px; }
      .ctab-lay:hover { color:var(--fg); background:var(--hover); }
      .ctab-lay.on { color:var(--accent); }

      /* Multi-chart grid (responsive; cells shrink to fit ANY count — no cap, no scroll) */
      .chart-grid { position:relative; flex:1 1 0; min-width:0; min-height:0; display:grid; gap:1px; background:var(--line); }
      .chart-cell { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg); overflow:hidden; }
      .chart-cell.active { box-shadow:inset 0 0 0 1px var(--accent); }
      .chart-cell-head { flex:none; display:flex; align-items:center; gap:7px; height:22px; padding:0 8px;
        background:var(--panel); border-bottom:1px solid var(--line); font-size:11px; cursor:pointer; white-space:nowrap;
        touch-action:none; /* a finger DRAG docks the chart (custom pointer-drag) instead of scrolling */ }
      .chart-cell.active .chart-cell-head { background:var(--panel2); }
      .chart-cell-sym { font-weight:700; color:var(--fg); }
      .chart-cell-tf { color:var(--accent); font-size:10px; }
      .chart-cell-max { margin-left:auto; background:none; border:0; color:var(--muted); font-size:12px; line-height:1; padding:0 3px; }
      .chart-cell-max:hover { color:var(--fg); }
      .chart-cell-x { background:none; border:0; color:var(--muted); font-size:13px; line-height:1; padding:0 2px; }
      .chart-cell-x:hover { color:var(--down); }
      /* A chart maximized over the grid (the layout is preserved underneath). */
      .chart-cell-body { position:relative; flex:1 1 0; min-width:0; min-height:0; display:flex; }
      /* Draggable grid gutters — resize the columns/rows into custom proportions. */
      .grid-gutter { position:absolute; z-index:6; }
      .grid-gutter-col { top:0; bottom:0; width:8px; margin-left:-4px; cursor:col-resize; }
      .grid-gutter-row { left:0; right:0; height:8px; margin-top:-4px; cursor:row-resize; }
      .grid-gutter:hover { background:var(--accent); opacity:.45; }

      /* Left sidebar split (Market Watch ↕ Accounts) + panel actions/maximize */
      .left-pane { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
      .left-split { flex:none; height:5px; cursor:row-resize; background:var(--line); }
      /* resize handles: a finger drag resizes (touch-action:none stops the browser scrolling/zooming) */
      .left-split, .vsplit, .hsplit, .grid-gutter { touch-action:none; }
      .left-split:hover { background:var(--accent); }
      .panel-h-actions { display:flex; align-items:center; gap:4px; }
      .panel-max { position:absolute; z-index:7; background:var(--panel2); border:1px solid var(--line2);
        color:var(--muted); border-radius:5px; font-size:13px; line-height:1; padding:3px 7px; }
      .panel-max:hover { color:var(--fg); border-color:var(--line-hover); }
      .toolbox-max { top:5px; right:10px; }

      /* Drawing engine (area G) — the overlay canvas + the left tool toolbar (with a
         style row) + the object-manager panel. The canvas sits above the chart but its
         pointer-events are toggled in JS so the chart still scrolls/zooms when idle.
         Everything is theme-aware (CSS vars) so it re-skins with the terminal theme. */
      .drawing-overlay { position:absolute; inset:0; z-index:3; }

      /* Left vertical tool toolbar */
      .dtb { position:absolute; top:50%; left:8px; transform:translateY(-50%); z-index:6;
        display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px;
        background:var(--panel); border:1px solid var(--line2); border-radius:9px;
        box-shadow:0 4px 16px rgba(0,0,0,.35); max-height:calc(100% - 24px); overflow-y:auto; overflow-x:visible; }
      /* Mobile selection toolbar (#9): a floating Edit / Delete / Deselect bar shown at the
         top of the pane when a drawing is selected (mobile has no right-click / Delete key). */
      .draw-seltools { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:8;
        display:flex; gap:4px; padding:4px; background:var(--panel); border:1px solid var(--line2);
        border-radius:9px; box-shadow:0 4px 16px rgba(0,0,0,.4); }
      .draw-seltool { display:inline-flex; align-items:center; gap:5px; min-height:36px; padding:0 12px;
        background:transparent; border:1px solid transparent; border-radius:7px; color:var(--fg);
        font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; touch-action:manipulation; }
      .draw-seltool:active { background:var(--hover); }
      .draw-seltool-danger { color:var(--down); }
      /* touch tiers: 44px drawing-tool buttons + selection tools (the June pass left them at desktop size) */
      #mt5[data-tier="mobile"] .dtb-btn, #mt5[data-tier="tablet"] .dtb-btn { width:44px; height:44px; font-size:18px; border-radius:8px; }
      #mt5[data-tier="mobile"] .dtb, #mt5[data-tier="tablet"] .dtb { gap:4px; padding:6px 5px; }
      #mt5[data-tier="mobile"] .dtb-sep, #mt5[data-tier="tablet"] .dtb-sep { width:28px; }
      #mt5[data-tier="mobile"] .draw-seltool, #mt5[data-tier="tablet"] .draw-seltool { min-height:44px; padding:0 14px; font-size:14px; }
      .dtb-group { display:flex; flex-direction:column; align-items:center; gap:2px; }
      .dtb-sep { width:20px; height:1px; background:var(--line); margin:3px 0; flex:none; }
      .dtb-btn { position:relative; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
        background:transparent; border:1px solid transparent; border-radius:6px; color:var(--muted); cursor:pointer;
        font-size:14px; line-height:1; padding:0; }
      .dtb-btn:hover:not(:disabled) { background:var(--hover); color:var(--fg); border-color:var(--line2); }
      .dtb-btn.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
      .dtb-btn:disabled { opacity:.35; cursor:default; }
      .dtb-ico { font-size:13px; font-weight:600; pointer-events:none; }

      /* Style row (colour / width / line-style / fill) — drops out beneath the bar */
      .dtb-style { display:flex; flex-direction:column; align-items:center; gap:5px; margin-top:4px; padding-top:5px;
        border-top:1px solid var(--line); width:100%; }
      .dtb-swatches { display:grid; grid-template-columns:repeat(4, 12px); gap:3px; justify-content:center; }
      .dtb-swatch { width:12px; height:12px; border-radius:3px; border:1px solid var(--line2); cursor:pointer; padding:0; }
      .dtb-swatch.on { outline:2px solid var(--fg); outline-offset:1px; }
      .dtb-swatch-custom { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
        background:conic-gradient(from 0deg, #f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
      .dtb-swatch-custom input { position:absolute; inset:-4px; opacity:0; cursor:pointer; }
      .dtb-widths, .dtb-linestyles { display:flex; gap:3px; justify-content:center; }
      .dtb-w { width:18px; height:18px; display:flex; align-items:center; justify-content:center; background:var(--hover);
        border:1px solid var(--line2); border-radius:4px; cursor:pointer; padding:0; }
      .dtb-w.on { border-color:var(--accent); background:var(--sel); }
      .dtb-w-bar { width:12px; background:var(--fg); border-radius:2px; display:block; }
      .dtb-ls { min-width:24px; height:18px; font-size:9px; letter-spacing:-1px; color:var(--muted); background:var(--hover);
        border:1px solid var(--line2); border-radius:4px; cursor:pointer; padding:0 2px; }
      .dtb-ls.on { border-color:var(--accent); background:var(--sel); color:var(--fg); }
      .dtb-fill { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--muted); cursor:pointer; }
      .dtb-fill input { margin:0; }

      /* Object-manager panel (the chart's drawing list) */
      .omp { position:absolute; top:10px; right:14px; z-index:6; width:210px; max-height:calc(100% - 24px);
        display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line2); border-radius:9px;
        box-shadow:0 4px 16px rgba(0,0,0,.35); overflow:hidden; font-size:12px; }
      .omp-head { display:flex; align-items:center; justify-content:space-between; padding:7px 10px;
        border-bottom:1px solid var(--line); font-weight:600; color:var(--fg); }
      .omp-x { background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px; }
      .omp-x:hover { background:var(--hover); color:var(--fg); }
      .omp-empty { padding:14px 12px; color:var(--muted); text-align:center; }
      .omp-list { list-style:none; margin:0; padding:4px; overflow-y:auto; }
      .omp-row { display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:6px; cursor:pointer; color:var(--fg); }
      .omp-row:hover { background:var(--hover); }
      .omp-row.on { background:var(--sel); }
      .omp-row.hidden .omp-label { opacity:.45; text-decoration:line-through; }
      .omp-ico { width:24px; text-align:center; font-weight:600; font-size:11px; flex:none; }
      .omp-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .omp-edit { flex:1; min-width:0; background:var(--bg); border:1px solid var(--accent); color:var(--fg); border-radius:4px; padding:2px 5px; font-size:12px; }
      .omp-actions { display:flex; gap:1px; flex:none; }
      .omp-act { background:transparent; border:none; cursor:pointer; font-size:11px; padding:2px 3px; border-radius:4px; opacity:.7; }
      .omp-act:hover:not(:disabled) { background:var(--line); opacity:1; }
      .omp-act:disabled { opacity:.3; cursor:default; }

      /* Toolbox */
      .toolbox-area { grid-area:toolbox; background:var(--panel); border-top:1px solid var(--line); min-height:0; position:relative; }
      .hsplit { position:absolute; top:-2px; left:0; right:0; height:6px; cursor:row-resize; z-index:6; }
      .hsplit:hover { background:var(--accent); }
      .toolbox { display:flex; flex-direction:column; height:100%; }
      /* Tab strip scrolls horizontally (hidden scrollbar) rather than clipping its
         right-most tabs off the edge at narrow widths. */
      .tb-tabs { display:flex; gap:2px; padding:5px 8px 0; border-bottom:1px solid var(--line); flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
      .tb-tabs::-webkit-scrollbar { display:none; }
      .tb-tab { flex:none; white-space:nowrap; background:transparent; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:6px 12px; font-size:12px; }
      .tb-tab.on { color:var(--fg); border-bottom-color:var(--accent); }
      .tb-body { flex:1; overflow:auto; min-height:0; }
      .tb-acct { display:flex; flex-wrap:wrap; gap:18px; padding:9px 12px; border-bottom:1px solid var(--line); }
      .stat { display:flex; flex-direction:column; gap:1px; }
      .stat-k { color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; }
      .stat-v { font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; }
      .tb-table { width:100%; border-collapse:collapse; }
      .tb-table th { text-align:left; color:var(--muted); font-weight:500; font-size:10.5px; padding:5px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
      .tb-table th.num { text-align:right; }
      .tb-table td { padding:5px 10px; border-bottom:1px solid var(--row-line); }
      .tb-table td.x { width:24px; text-align:center; }
      /* row actions (Modify ✎ + Close/Cancel ×) + the "Pending orders" sub-header */
      .tb-table td.tb-rowacts { width:auto; white-space:nowrap; text-align:right; }
      .tb-table .tb-rowacts .rm { margin-left:2px; }
      .tb-table .tb-subhead { color:var(--muted); text-transform:uppercase; letter-spacing:.5px;
        font-size:10px; font-weight:600; padding-top:12px; background:var(--panel); }
      /* History tab: Positions / Orders / Deals sub-tabs (left) + the time-range filter (right). */
      .tb-hist { display:flex; flex-direction:column; min-height:0; }
      .tb-hist-bar { display:flex; align-items:center; justify-content:space-between; gap:10px;
        flex-wrap:wrap; padding:6px 10px; border-bottom:1px solid var(--line); background:var(--panel); }
      .tb-hist-tabs { display:flex; gap:2px; }
      .tb-hist-tabs button { background:transparent; border:0; border-bottom:2px solid transparent;
        color:var(--muted); padding:4px 12px; font-size:11.5px; cursor:pointer; }
      .tb-hist-tabs button.on { color:var(--fg); border-bottom-color:var(--accent); }
      .tb-hist-right { display:flex; align-items:center; gap:12px; }
      .tb-hist-total { font-size:11.5px; color:var(--muted); }
      .tb-period { background:var(--panel); color:var(--fg); border:1px solid var(--line);
        border-radius:5px; padding:4px 8px; font-size:11.5px; cursor:pointer; }
      .tb-hist-empty { padding:14px 12px; }
      .journal { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; color:var(--muted); white-space:pre-wrap; padding:8px 12px; }

      /* Settings dialog */
      .settings-dialog { width:440px; background:var(--panel); border:1px solid var(--line2); border-radius:12px; box-shadow:0 16px 48px var(--shadow); }
      .settings-dialog .panel-h { border-radius:12px 12px 0 0; font-size:12px; }
      .settings-body { padding:6px 16px 16px; }
      .settings-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); }
      .settings-row:last-child { border-bottom:0; }
      .settings-label { font-size:13px; font-weight:600; margin-bottom:2px; }

      /* Order dialog */
      .modal-backdrop { position:fixed; inset:0; background:var(--backdrop); display:flex; align-items:center; justify-content:center; z-index:50; }
      .order-dialog { width:330px; background:var(--panel); border:1px solid var(--line2); border-radius:12px; padding:0 0 16px; box-shadow:0 16px 48px var(--shadow); }
      .order-dialog .panel-h { border-radius:12px 12px 0 0; font-size:12px; }
      .order-dialog label { display:block; color:var(--muted); font-size:11px; margin:10px 16px 4px; }
      .order-dialog select, .order-dialog > input { width:calc(100% - 32px); margin:0 16px; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:8px 10px; font-size:13px; }
      /* mobile: the symbol field is a button → a searchable picker (Item 7) */
      .order-dialog .ord-sym-btn { width:calc(100% - 32px); margin:0 16px; background:var(--panel2);
        border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:8px 10px; font-size:15px;
        display:flex; align-items:center; justify-content:space-between; min-height:44px; }
      .order-dialog .ord-sym-caret { color:var(--muted); }
      .order-dialog .row { display:flex; gap:8px; margin:0 16px; }
      .order-dialog .row > div { flex:1; } .order-dialog .row label { margin-left:0; } .order-dialog .row input { width:100%; margin:0; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:8px 10px; }
      .vol { display:flex; gap:6px; margin:0 16px; }
      .vol input { flex:1; text-align:center; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:8px; font-size:14px; font-weight:600; }
      .stepbtn { width:38px; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px; font-size:18px; }
      /* New-Order live tick sparkline (#7): a short, tightly-autoscaled mini chart. */
      /* New-Order live tick mini-chart (#7/#16/#20): continuous height set inline; the grip
         below the chart drag-resizes it. */
      .micro-tick-head { display:flex; align-items:center; justify-content:space-between; margin:6px 16px 3px; }
      .micro-tick-title { color:var(--muted); font-size:11px; }
      .micro-tick-wrap { position:relative; margin:0 16px 0; border:1px solid var(--line);
        border-radius:8px 8px 0 0; border-bottom:0; background:var(--panel2); overflow:hidden; }
      /* drag-to-resize grip — the chart's draggable bottom edge (no sm/md/lg presets, #20). */
      .micro-tick-resize { display:flex; align-items:center; justify-content:center; height:15px;
        margin:0 16px 4px; border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px;
        background:var(--panel2); cursor:ns-resize; touch-action:none; }
      .micro-tick-grip { width:34px; height:4px; border-radius:2px; background:var(--line2); transition:background .12s, width .12s; }
      .micro-tick-resize:hover .micro-tick-grip { background:var(--muted); width:42px; }
      .micro-tick-resize:active .micro-tick-grip { background:var(--accent); width:42px; }
      .micro-tick { display:block; width:100%; height:100%; }
      .micro-tick-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        color:var(--muted); font-size:11px; pointer-events:none; }
      .ord-types { display:flex; gap:6px; margin:0 16px; }
      .ord-types .ord-type { flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:7px 6px; font-size:12px; font-weight:600; cursor:pointer; }
      .ord-types .ord-type.active { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
      .order-btns { display:flex; gap:8px; margin:16px 16px 0; }
      .order-btns button { flex:1; border:0; border-radius:8px; padding:10px; color:var(--on-accent); display:flex; flex-direction:column; align-items:center; gap:2px; font-weight:600; }
      .order-btns .sell { background:var(--down); } .order-btns .buy { background:var(--up); }
      .order-btns b { font-size:14px; font-variant-numeric:tabular-nums; }
      /* Modify dialog (reuses .order-dialog / .modal-backdrop / .order-btns) */
      .modify-sum { margin:2px 16px 0; font-size:14px; }
      .order-btns .modify-go { background:var(--accent); }

      /* ── Theme: switcher control ── */
      .theme-select { background:var(--panel2); border:1px solid var(--line); color:var(--fg);
        border-radius:6px; padding:4px 6px; font-size:11px; font-family:inherit; }
      .theme-select:hover { border-color:var(--line-hover); }
      .theme-select:focus { outline:none; border-color:var(--accent); }
      .settings-row .theme-select { padding:6px 8px; font-size:12px; }

      /* ── Theme: retro SNES / NES pixel skins (8-bit / 16-bit) ──
         Toggled by a `.theme-8bit` / `.theme-16bit` class the ThemeProvider sets on
         <body>. The @font-face for "Press Start 2P" (bundled OFL data-URL) is injected
         lazily by the ThemeProvider only when a skin is active — so the ~150KB payload
         never loads for the normal themes. The font stack falls back to a monospace
         family so layout is never broken even before the face is registered.
         These rules only touch chrome (font/borders/rendering); they read the same
         tokens, so the palette comes from the active theme above. */
      body.theme-8bit, body.theme-16bit {
        --skin-font: 'Press Start 2P', 'Courier New', ui-monospace, monospace;
        --skin-border-width: 2px;
      }
      /* Pixel font is dense per-glyph: shrink the base size, widen line-height, kill
         antialias smoothing, and pixelate the canvas so it reads as a CRT. */
      body.theme-8bit, body.theme-16bit,
      body.theme-8bit .toolbar, body.theme-16bit .toolbar {
        font-family: var(--skin-font);
        -webkit-font-smoothing: none;
        font-smooth: never;
        letter-spacing: 0;
      }

      /* ── Theme: CRT / scanline overlay ──
         A full-viewport, NON-interactive (`pointer-events:none`) layer the
         ThemeProvider creates once and shows for CRT skins. It NEVER captures input
         and is `position:fixed` so it can't affect layout or hit-testing. Scanlines +
         a soft vignette give the retro tube look without touching any other element. */
      .crt-overlay {
        position: fixed; inset: 0; z-index: 9999; pointer-events: none; display: none;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,0.16) 0px,
            rgba(0,0,0,0.16) 1px,
            rgba(0,0,0,0) 2px,
            rgba(0,0,0,0) 3px
          ),
          radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,0.28) 100%);
        mix-blend-mode: multiply;
      }
      /* A subtle flicker — disabled for users who prefer reduced motion. */
      @keyframes crt-flicker { 0%,100% { opacity:0.92; } 50% { opacity:1; } }
      .crt-overlay { animation: crt-flicker 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .crt-overlay { animation: none; } }

      /* Matrix theme: the digital-rain backdrop is a fixed z-index:0 <canvas> the
         ThemeProvider mounts on <body>. #root sits above it (z-index:1) but transparent,
         so the rain glows through the theme's translucent panels (the chart stays opaque). */
      body.theme-matrix #root { background: transparent; position: relative; z-index: 1; }

      /* ── Theme: OLD SCHOOL DARK = WINDOWS 95/98 (structural, not just colour) ──
         A real beveled Win95 trading app: gray 3D bevels (raised chrome / sunken inputs)
         via inset box-shadows (light top-left, dark bottom-right — non-layout-affecting),
         square corners, no soft shadows, a Tahoma/MS-Sans bitmap font, navy title bar. */
      body.theme-oldschooldark {
        --w95-raised: inset 1px 1px 0 #9a9a9a, inset -1px -1px 0 #000000, inset 2px 2px 0 #606060, inset -2px -2px 0 #181818;
        --w95-sunken: inset 1px 1px 0 #000000, inset -1px -1px 0 #9a9a9a, inset 2px 2px 0 #181818, inset -2px -2px 0 #606060;
        --w95-font: 'Tahoma', 'MS Sans Serif', 'Segoe UI', Verdana, sans-serif;
        font-size: 12px;

      body.theme-oldschooldark,
      body.theme-oldschooldark button, body.theme-oldschooldark input,
      body.theme-oldschooldark select, body.theme-oldschooldark textarea,

      body.theme-oldschooldark * { border-radius: 0 !important; }
      /* Navy title bar (the toolbar doubles as the window title bar). */
      body.theme-oldschooldark .toolbar {
        background: linear-gradient(90deg, #0a246a 0%, #2a5fae 100%);
        color: #fff; border: 0; box-shadow: var(--w95-raised);
      }
      body.theme-oldschooldark .toolbar .logo-word, body.theme-oldschooldark .toolbar .active-sym { color: #fff; }
      /* Raised gray panels. */
      body.theme-oldschooldark .left, body.theme-oldschooldark .toolbox-area,
      body.theme-oldschooldark .mw, body.theme-oldschooldark .tb-acct,
      body.theme-oldschooldark .settings-dialog, body.theme-oldschooldark .order-dialog,
      body.theme-oldschooldark .modify-dialog, body.theme-oldschooldark .login .card {
        background: var(--panel); border: 0 !important; box-shadow: var(--w95-raised);
      }
      /* Buttons/tabs: raised; pressed or "on" → sunken. box-shadow keeps their fill (so the
         BUY/SELL colours survive) while adding the bevel — no layout shift. */
      body.theme-oldschooldark button, body.theme-oldschooldark .tf,
      body.theme-oldschooldark .primary, body.theme-oldschooldark .ebtn,
      body.theme-oldschooldark .mw-tab, body.theme-oldschooldark .tb-tab,
      body.theme-oldschooldark .neworder, body.theme-oldschooldark .danger,

      body.theme-oldschooldark .tb-tab.on, body.theme-oldschooldark .primary:active {

      }
      /* Inputs/selects: sunken wells. */
      body.theme-oldschooldark input, body.theme-oldschooldark select, body.theme-oldschooldark textarea {
        background: #1e1e1e; color: var(--fg); border: 0 !important; box-shadow: var(--w95-sunken);
      }

      /* ── Theme: NeXTSTEP (structural) ──

      body.theme-nextstep {

      body.theme-nextstep input, body.theme-nextstep select, body.theme-nextstep textarea {

      /* ── Theme: CLASSIC MAC OS / PLATINUM (structural) ──

      body.theme-platinum,

      /* ── Theme: CLASSIC MAC OS DARK (structural) ── dark sibling of Platinum: a DARK gray
         PINSTRIPE title bar, dark rounded-rect buttons with a soft bevel, the Mac selection blue. */
      body.theme-platinumdark,

      /* ── Theme: DOS AMBER TERMINAL (structural) ──

      body.theme-dosamber .modify-dialog, body.theme-dosamber .login .card {

      /* ── Skin: CRT-PIXEL (shared pixel-font skin; used by Green Phosphor) ──

      body.crt-pixel { --skin-font: 'Press Start 2P', 'Courier New', ui-monospace, monospace; }

      /* ── Theme: WINDOWS XP (LUNA) — bright CERULEAN glossy title bar (white shine band on

      body.theme-winxp .toolbar {

        color: #0a1428; border: 1px solid #8aa9cc; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
      }
      body.theme-winxp button:hover, body.theme-winxp .tf:hover { border-color: #f0a000; box-shadow: inset 0 0 0 1px rgba(255,210,120,0.85), 0 0 5px rgba(255,170,0,0.5); }
      body.theme-winxp button:active, body.theme-winxp .tf.on, body.theme-winxp .mw-tab.on, body.theme-winxp .tb-tab.on {
        background: linear-gradient(180deg, #d2e0f4 0%, #bcd2f0 50%, #cadcf6 100%); box-shadow: inset 0 1px 3px rgba(0,40,120,0.3);

      /* ── Theme: WINDOWS 7 (AERO) — prominent frosted GLASS (heavy backdrop-blur, translucent),

      body.theme-win7 .toolbar {

      body.theme-win7 .toolbar .active-sym { color: #0d5bb8; }
      body.theme-win7 .left, body.theme-win7 .toolbox-area, body.theme-win7 .settings-dialog, body.theme-win7 .order-dialog {
        background: rgba(234,243,253,0.58); -webkit-backdrop-filter: blur(22px) saturate(1.25); backdrop-filter: blur(22px) saturate(1.25);

      body.theme-github, body.theme-githublight,

      /* ── Settings (full-page view) ──
         The enhanced Settings PAGE — a real sectioned view (replaces the old centre
         modal). Mounted by the shell as a full-bleed surface over the workspace
         (toolbar stays). Two columns: a left section-nav + search, and a scrolling
         content pane whose controls are auto-rendered from the settings descriptors.
         Everything reads the theme tokens so it recolours live with the active theme;
         append-only — no rule above is modified. */
      .sp { position:absolute; inset:0; z-index:40; display:grid; grid-template-columns:228px 1fr;
        background:var(--bg); color:var(--fg); overflow:hidden; }
      /* nav */
      .sp-nav { display:flex; flex-direction:column; min-height:0; background:var(--panel);
        border-right:1px solid var(--line); }
      .sp-nav-head { display:flex; align-items:center; justify-content:space-between; padding:14px 14px 10px; }
      .sp-nav-title { font-size:15px; font-weight:600; letter-spacing:.2px; }
      .sp-close { background:none; border:0; color:var(--muted); font-size:22px; line-height:1; padding:0 4px; }
      .sp-close:hover { color:var(--fg); }
      .sp-search { padding:0 12px 10px; }
      .sp-search input { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--fg);
        border-radius:7px; padding:7px 10px; font-size:12.5px; }
      .sp-search input:focus { outline:none; border-color:var(--accent); }
      .sp-nav-list { list-style:none; margin:0; padding:4px 8px; overflow:auto; flex:1; min-height:0; }
      .sp-nav-item { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
        background:none; border:0; color:var(--muted); text-align:left; padding:8px 10px; border-radius:7px;
        font-size:12.5px; font-weight:500; }
      .sp-nav-item:hover { background:var(--hover); color:var(--fg); }
      .sp-nav-item.on { background:var(--sel); color:var(--fg); font-weight:600; }
      .sp-nav-item.dim { opacity:.42; }
      .sp-nav-count { background:var(--accent); color:var(--on-accent); border-radius:999px;
        font-size:10px; font-weight:700; min-width:17px; height:17px; padding:0 5px;
        display:inline-flex; align-items:center; justify-content:center; }
      .sp-nav-foot { padding:10px 14px; border-top:1px solid var(--line); }
      .sp-nav-foot code, .sp-section-head code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
        color:var(--fg); font-size:11px; }
      /* content */
      .sp-content { overflow:auto; min-height:0; padding:20px 26px 40px; max-width:760px; }
      .sp-section-head { margin:2px 0 12px; }
      .sp-section-head h2 { margin:0 0 4px; font-size:18px; font-weight:600; }
      .sp-section-head p { margin:0; font-size:12.5px; line-height:1.5; max-width:62ch; }
      .sp-empty { padding:18px 2px; font-size:13px; }

      /* a setting row (descriptor-driven) */
      .sp-row, .sp-action-row { display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
        padding:14px 2px; border-bottom:1px solid var(--line); }
      .sp-row-label { min-width:0; flex:1; }
      .sp-row-title { font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .sp-row-help { color:var(--muted); font-size:12px; margin-top:3px; line-height:1.45; max-width:54ch; }
      .sp-row-path { color:var(--muted); opacity:.7; font-size:10.5px; margin-top:4px;
        font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sp-row-control { display:flex; align-items:center; gap:10px; flex:none; padding-top:1px; }
      .sp-badge { background:var(--accent); color:var(--on-accent); border-radius:999px; font-size:9.5px;
        font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:1px 7px; }
      .sp-hl { background:var(--gold); color:var(--bg); border-radius:3px; padding:0 2px; }
      .sp-row.scoped { background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%); }

      /* per-chart "this chart" toggle */
      .sp-scope { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:11px;
        white-space:nowrap; cursor:pointer; }
      .sp-scope input { accent-color:var(--accent); }

      /* controls */
      .sp-toggle { position:relative; width:38px; height:21px; border-radius:999px; border:1px solid var(--line2);
        background:var(--panel2); padding:0; transition:background .12s, border-color .12s; flex:none; }
      .sp-toggle .sp-toggle-knob { position:absolute; top:1px; left:1px; width:17px; height:17px; border-radius:50%;
        background:var(--muted); transition:transform .12s, background .12s; }
      .sp-toggle.on { background:var(--accent); border-color:var(--accent); }
      .sp-toggle.on .sp-toggle-knob { transform:translateX(17px); background:var(--on-accent); }
      .sp-select { background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px;
        padding:6px 9px; font-size:12.5px; font-family:inherit; min-width:140px; }
      .sp-select:hover { border-color:var(--line-hover); }
      .sp-select:focus { outline:none; border-color:var(--accent); }
      .sp-number, .sp-text { background:var(--panel2); border:1px solid var(--line); color:var(--fg);
        border-radius:7px; padding:6px 9px; font-size:12.5px; font-family:inherit; }
      .sp-number { width:96px; text-align:right; font-variant-numeric:tabular-nums; }
      .sp-text { width:200px; }
      .sp-number:focus, .sp-text:focus { outline:none; border-color:var(--accent); }
      .sp-color { display:flex; align-items:center; gap:7px; }
      .sp-color-swatch { width:30px; height:26px; padding:0; border:1px solid var(--line); border-radius:6px;
        background:var(--panel2); cursor:pointer; }
      .sp-color-text { width:118px; background:var(--panel2); border:1px solid var(--line); color:var(--fg);
        border-radius:7px; padding:6px 8px; font-size:11.5px; font-family:ui-monospace, monospace; }
      .sp-color-text:focus { outline:none; border-color:var(--accent); }

      /* theme picker */
      .sp-theme { padding:6px 0 16px; border-bottom:1px solid var(--line); margin-bottom:6px; }
      .sp-theme-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
      .sp-swatch { background:var(--panel); border:2px solid var(--line2); padding:6px; cursor:pointer;
        display:flex; flex-direction:column; gap:6px; text-align:left; }
      .sp-swatch:hover { border-color:var(--accent); }
      .sp-swatch.on { box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
      .sp-swatch-prev { overflow:hidden; height:78px; display:flex; flex-direction:column; }
      .sp-swatch-bar { height:14px; display:flex; align-items:center; gap:4px; padding:0 6px; flex:none; }
      .sp-swatch-dot { width:5px; height:5px; border-radius:50%; }
      .sp-swatch-chart { position:relative; flex:1; }
      .sp-swatch-grid { position:absolute; inset:0; background-size:18px 14px; opacity:.6; }
      .sp-swatch-candle { position:absolute; width:8px; border:1px solid transparent; border-radius:1px; }
      .sp-swatch-wick { position:absolute; width:1px; }
      .sp-swatch-line { position:absolute; left:8%; right:8%; top:58%; height:2px; opacity:.85; border-radius:2px; }
      .sp-swatch-meta { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:0 2px; }
      .sp-swatch-name { font-size:11.5px; font-weight:600; }
      .sp-swatch-active { font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
      .sp-theme-note { margin:10px 0 0; }

      /* buttons (data/account + advanced) */
      .sp-btn { background:var(--accent); color:var(--on-accent); border:0; border-radius:7px; padding:7px 14px;
        font-size:12.5px; font-weight:600; font-family:inherit; }
      .sp-btn:hover:not(:disabled) { filter:brightness(1.08); }
      .sp-btn.ghost { background:var(--hover); color:var(--fg); border:1px solid var(--line2); }
      .sp-btn.ghost:hover:not(:disabled) { border-color:var(--line-hover); }
      .sp-btn.danger { background:var(--down); color:#fff; }
      .sp-btn:disabled { opacity:.45; cursor:default; }
      .sp-file { position:relative; overflow:hidden; cursor:pointer; display:inline-flex; align-items:center; }
      .sp-file input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; }

      /* advanced */
      .sp-advanced { padding-top:6px; }
      .sp-adv-block { padding:14px 0; border-bottom:1px solid var(--line); }
      .sp-adv-block .sp-row-title { font-size:14px; }
      .sp-adv-block .sp-row-help { margin-bottom:10px; }
      .sp-adv-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:4px; }
      .sp-json { width:100%; background:var(--input-ro); border:1px solid var(--line); color:var(--fg);
        border-radius:8px; padding:9px 11px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size:11.5px; line-height:1.45; margin-top:8px; resize:vertical; }
      .sp-json:focus { outline:none; border-color:var(--accent); }
      .sp-adv-status { margin-top:14px; }

      /* pixel skins: square the settings chrome to match the retro look */
      body.theme-8bit .sp-swatch, body.theme-16bit .sp-swatch,
      body.theme-8bit .sp-btn, body.theme-16bit .sp-btn,
      body.theme-8bit .sp-select, body.theme-16bit .sp-select,
      body.theme-8bit .sp-number, body.theme-16bit .sp-number,
      body.theme-8bit .sp-text, body.theme-16bit .sp-text,
      body.theme-8bit .sp-search input, body.theme-16bit .sp-search input,
      body.theme-8bit .sp-nav-item, body.theme-16bit .sp-nav-item,
      body.theme-8bit .sp-toggle, body.theme-16bit .sp-toggle,
      body.theme-8bit .sp-json, body.theme-16bit .sp-json {
        border-radius:0; border-width:var(--skin-border-width); border-style:solid;
      }
      body.theme-8bit .sp-toggle .sp-toggle-knob, body.theme-16bit .sp-toggle .sp-toggle-knob { border-radius:0; }
      body.theme-8bit .sp-content, body.theme-16bit .sp-content { font-size:9px; line-height:1.8; }

      /* ── Alerts / Sounds (alerts manager panel + toast surface) ──
         All colours are theme tokens so the surface re-themes live. The toast stack is
         a fixed top-right column; pointer-events are scoped to the cards so it never
         blocks the chart underneath. */
      /* Toast surface */
      .toast-stack { position:fixed; top:calc(48px + var(--ta-top-inset,0px)); right:14px; z-index:120; display:flex; flex-direction:column; gap:8px;
        width:300px; max-width:calc(100vw - 28px); pointer-events:none; }
      .toast { pointer-events:auto; display:flex; align-items:flex-start; gap:9px; padding:10px 11px;
        background:var(--panel); border:1px solid var(--line2); border-left:3px solid var(--accent);
        border-radius:9px; box-shadow:0 10px 30px var(--shadow); cursor:pointer;
        animation:toast-in .16s ease-out; }
      .toast:hover { border-color:var(--line-hover); }
      .toast-alert { border-left-color:var(--gold); }
      .toast-success { border-left-color:var(--green); }
      .toast-error { border-left-color:var(--down); }
      .toast-info { border-left-color:var(--accent); }
      .toast-icon { font-size:14px; line-height:1.3; flex:0 0 auto; }
      .toast-text { flex:1; min-width:0; }
      .toast-title { font-size:12.5px; font-weight:600; color:var(--fg); word-break:break-word; }
      .toast-body { font-size:11px; color:var(--muted); margin-top:2px; word-break:break-word; }
      .toast-x { flex:0 0 auto; background:none; border:0; color:var(--muted); font-size:15px; line-height:1; padding:0 2px; }
      .toast-x:hover { color:var(--fg); }
      @keyframes toast-in { from { opacity:0; transform:translateX(12px); } to { opacity:1; transform:translateX(0); } }

      /* Alerts manager panel */
      .alerts-panel { padding:10px 12px; }
      .alerts-add { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-bottom:10px; border-bottom:1px solid var(--line); }
      .alerts-add select, .alerts-add input { background:var(--panel2); border:1px solid var(--line); color:var(--fg);
        border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit; }
      .alerts-add .al-sym { min-width:120px; } .alerts-add .al-price { width:110px; } .alerts-add .al-acc { max-width:200px; }
      .alerts-add select:focus, .alerts-add input:focus { outline:none; border-color:var(--accent); }
      .alerts-empty { padding:14px 2px; }
      .alerts-push { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:8px 2px; border-bottom:1px solid var(--line); }
      .alerts-push label { display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
      .al-table { width:100%; border-collapse:collapse; margin-top:8px; }
      .al-table th { text-align:left; color:var(--muted); font-weight:500; font-size:10.5px; padding:5px 8px; border-bottom:1px solid var(--line); }
      .al-table th.num { text-align:right; }
      .al-table td { padding:5px 8px; border-bottom:1px solid var(--row-line); font-size:12px; vertical-align:middle; }
      .al-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
      .al-row.al-off { opacity:0.5; }
      .al-row.al-fired .al-badge { color:var(--gold); }
      .al-en { width:22px; text-align:center; }
      .al-badge { font-weight:600; }
      .al-actions { white-space:nowrap; text-align:right; }
      .al-actions .linkbtn { margin-right:8px; }
      .al-actions .rm { visibility:visible; }
      /* Pixel-skin squaring (match the rest of the retro chrome) */
      body.theme-8bit .toast, body.theme-16bit .toast,
      body.theme-8bit .alerts-add select, body.theme-16bit .alerts-add select,
      body.theme-8bit .alerts-add input, body.theme-16bit .alerts-add input {
        border-radius:0; border-width:var(--skin-border-width); border-style:solid;
      }

      /* ── Layout: status bar (footer) ──
         The pinned bottom strip (grid row "status"). A slim, single-line cluster of
         live read-outs: connection state, symbol+TF, bid/spread, server clock +
         candle countdown, balance/equity/floating P&L, and an optional tool hint.
         All colours are theme tokens so it re-themes live; append-only, no rule above
         is modified. Tabular numerics so the figures don't jitter as they update. */
      .statusbar { grid-column:1 / -1; display:flex; align-items:center; gap:10px;
        height:24px; padding:0 12px; overflow:hidden; white-space:nowrap;
        background:var(--panel); border-top:1px solid var(--line);
        font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
      .statusbar .sb-sep { width:1px; height:13px; background:var(--line2); flex:none; }
      .statusbar .sb-spacer { flex:1 1 auto; min-width:8px; }
      .statusbar .sb-dim { color:var(--muted); opacity:.6; }
      .statusbar .sb-k { color:var(--muted); opacity:.7; margin-right:1px; }
      .statusbar .sb-v { color:var(--fg); font-weight:600; }
      .statusbar .sb-k + .sb-v { margin-right:9px; }
      /* connection chip */
      .statusbar .sb-conn { display:inline-flex; align-items:center; gap:6px; flex:none; }
      .statusbar .sb-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none; }
      .statusbar .sb-warm { color:var(--green); }
      .statusbar .sb-warm .sb-dot { background:var(--green); box-shadow:0 0 6px var(--green-glow); }
      .statusbar .sb-connecting { color:var(--accent); }
      .statusbar .sb-connecting .sb-dot { background:var(--accent); animation:pulse 1s ease-in-out infinite; }
      .statusbar .sb-offline { color:var(--amber); }
      .statusbar .sb-offline .sb-dot { background:var(--amber); }
      /* symbol + tf */
      .statusbar .sb-sym b { color:var(--fg); font-weight:600; }
      .statusbar .sb-tf { color:var(--accent); font-weight:600; }
      /* quote / clock / countdown / account */
      .statusbar .sb-quote, .statusbar .sb-acct { display:inline-flex; align-items:center; gap:0; flex:none; }
      .statusbar .sb-clock { color:var(--fg); font-weight:600; flex:none; }
      .statusbar .sb-count { color:var(--muted); flex:none; }
      .statusbar .sb-pl.sb-up { color:var(--up); } .statusbar .sb-pl.sb-down { color:var(--down); }
      .statusbar .sb-up { color:var(--up); } .statusbar .sb-down { color:var(--down); }
      .statusbar .sb-ccy { color:var(--muted); opacity:.7; margin-left:2px; }
      .statusbar .sb-tool { color:var(--accent); flex:none; }
      /* Pixel skin: square + thicker top border, smaller dense type. */
      body.theme-8bit .statusbar, body.theme-16bit .statusbar {
        border-width:var(--skin-border-width); font-size:8px; height:auto; line-height:1.9; }

      /* ── Responsive (WEB ONLY) ──────────────────────────────────────────────────
         The #mt5 GRID is reflowed in JS (Terminal.tsx gridStyle — it's an inline style
         that would override @media), and #mt5 carries data-tier="desktop|tablet|mobile"
         from the useViewport() hook. The hook resolves 'desktop' on the Electron app
         (no `.web`/data-platform marker → never reflows) and reflows by width only on
         the web build (marker injected before first paint). So these rules key off
         #mt5[data-tier=…]: they are INERT on desktop (attr is always "desktop") and on
         the web they light up exactly when the matching mobile/tablet DOM is rendered.
         The web build also sets viewport-fit=cover, so env(safe-area-inset-*) clears the
         iPhone home-indicator / notch and the Android gesture bar. Breakpoints mirror
         useViewport.ts (mobile ≤600, tablet 601–1024). No feature is removed — panels
         are re-homed into a bottom-nav (mobile) / drawer + sheet (tablet). */

      /* hide the desktop maximize affordances on touch tiers (they reflow, not maximize) */
      #mt5[data-tier="mobile"] .toolbox-max, #mt5[data-tier="tablet"] .toolbox-max,
      #mt5[data-tier="mobile"] .ctab-max, #mt5[data-tier="tablet"] .ctab-max,
      #mt5[data-tier="mobile"] .chart-cell-max, #mt5[data-tier="tablet"] .chart-cell-max { display:none; }
      /* multi-pane layouts (side-by-side/grid) aren't practical on a phone — drop the layout
         switcher there so the symbol tabs get the full width (the + add-chart stays). */
      #mt5[data-tier="mobile"] .ctab-layout { display:none; }

      /* ── TABLET (601–1024): chart full-width; left sidebar → off-canvas drawer ── */
      #mt5[data-tier="tablet"] .toolbar .logo, #mt5[data-tier="tablet"] .toolbar .who { display:none; }
      /* Drop the symbol pill on tablet (it's shown in the status bar + chart tabs) to give
         the action cluster the width it needs; the tf-bar already scrolls. */
      #mt5[data-tier="tablet"] .toolbar .active-sym { display:none; }
      #mt5[data-tier="tablet"] .toolbar .tf-bar { overflow-x:auto; }
      #mt5[data-tier="tablet"] .m-drawer {
        position:fixed; top:calc(42px + var(--ta-top-inset,0px)); bottom:24px; left:0; z-index:60; width:min(300px, 82vw);
        padding-left:env(safe-area-inset-left); background:var(--panel); border-right:1px solid var(--line2);
        box-shadow:6px 0 24px var(--shadow); transform:translateX(-102%); transition:transform .18s ease;
        display:flex; flex-direction:column; overflow:hidden; }
      #mt5[data-tier="tablet"] .m-drawer.on { transform:translateX(0); }
      #mt5[data-tier="tablet"] .m-drawer .left-pane { min-height:0; }
      #mt5[data-tier="tablet"] .m-drawer-scrim {
        position:fixed; inset:calc(42px + var(--ta-top-inset,0px)) 0 24px 0; z-index:59; background:var(--backdrop);
        opacity:0; pointer-events:none; transition:opacity .18s; }
      #mt5[data-tier="tablet"] .m-drawer-scrim.on { opacity:1; pointer-events:auto; }

      /* ── MOBILE (≤600): single column + bottom tab bar; non-chart views overlay the
         always-mounted chart (.m-overlay) so lightweight-charts is never resized to 0 ── */
      #mt5[data-tier="mobile"] .m-overlay {
        grid-area:main; position:relative; min-width:0; min-height:0; overflow:hidden;
        display:flex; flex-direction:column; background:var(--bg); z-index:8; }
      #mt5[data-tier="mobile"] .m-overlay .left,
      #mt5[data-tier="mobile"] .m-overlay .toolbox-area {
        width:100%; flex:1 1 0; min-height:0; border:0; position:relative; }
      #mt5[data-tier="mobile"] .m-overlay .m-left { display:flex; flex-direction:column; }
      #mt5[data-tier="mobile"] .m-moresec { display:flex; flex-direction:column; }
      #mt5[data-tier="mobile"] .m-more-actions {
        display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:none;
        padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel); }

      /* LANDSCAPE phone on the Charts view = chart-only: the tab bar and the one-tap band
         give the chart their height back; rotate back (or any other view) restores them. */
      /* …only on a genuinely SHORT viewport (data-compact = a real phone on its side). A tall
         desktop window forced to the mobile layout is "landscape" too but must KEEP its nav. */
      #mt5[data-tier="mobile"][data-orient="landscape"][data-compact="1"][data-mview="chart"] .m-nav,
      #mt5[data-tier="mobile"][data-orient="landscape"][data-compact="1"][data-mview="chart"] .m-band { display:none; }
      /* live-stream dropped: a floating pill under the header (the status bar is hidden on phones) */
      #mt5[data-tier="mobile"] .m-net { position:fixed; top:calc(60px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
        z-index:40; padding:7px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--line2);
        color:var(--fg); font-size:12px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.35); white-space:nowrap;
        max-width:calc(100vw - 24px); overflow:hidden; text-overflow:ellipsis; }
      #mt5[data-tier="mobile"] .m-net::before { content:''; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%;
        background:var(--down); animation:m-net-blink 1s ease-in-out infinite; vertical-align:middle; }
      @keyframes m-net-blink { 50% { opacity:.25; } }
      /* bottom tab bar */
      #mt5[data-tier="mobile"] .m-nav {
        grid-area:nav; display:flex; align-items:stretch; background:var(--panel);
        border-top:1px solid var(--line2);
        height:calc(52px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); }
      #mt5[data-tier="mobile"] .m-nav button {
        flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:3px; background:none; border:0; color:var(--muted); font-size:10px; padding:6px 0; }
      #mt5[data-tier="mobile"] .m-nav .m-nav-ico { font-size:19px; line-height:1; }
      #mt5[data-tier="mobile"] .m-nav button.on { color:var(--accent); }

      /* condense the toolbar — the hidden actions live in the More tab */
      #mt5[data-tier="mobile"] .toolbar { gap:8px; padding:0 8px; }
      #mt5[data-tier="mobile"] .toolbar .tb-left { min-width:0; }
      #mt5[data-tier="mobile"] .toolbar .logo,
      #mt5[data-tier="mobile"] .toolbar .editor-toggle,
      #mt5[data-tier="mobile"] .toolbar .theme-select,
      #mt5[data-tier="mobile"] .toolbar > .tb-right > .iconbtn,
      #mt5[data-tier="mobile"] .toolbar .who,
      #mt5[data-tier="mobile"] .toolbar .tb-right > .linkbtn { display:none; }
      #mt5[data-tier="mobile"] .toolbar .tf-bar { overflow-x:auto; flex:1 1 auto; }

      /* order ticket → bottom sheet */
      #mt5[data-tier="mobile"] .modal-backdrop { align-items:flex-end; }
      #mt5[data-tier="mobile"] .order-dialog {
        width:100%; max-width:none; border-radius:14px 14px 0 0; max-height:92vh; overflow-y:auto;
        padding-bottom:calc(16px + env(safe-area-inset-bottom)); }

      /* settings page → single column */
      #mt5[data-tier="mobile"] .sp { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
      #mt5[data-tier="mobile"] .sp-nav { border-right:0; border-bottom:1px solid var(--line); max-height:38vh; }
      #mt5[data-tier="mobile"] .sp-content { padding:14px 16px 40px; }

      /* roomier tap targets on the dense tables */
      #mt5[data-tier="mobile"] .mw-table td, #mt5[data-tier="mobile"] .tb-table td { padding:10px; }
      #mt5[data-tier="mobile"] .mw-table th, #mt5[data-tier="mobile"] .tb-table th { padding:8px 10px; }
      /* The 10-col positions table (Toolbox Trade tab, reached via ☰) overflows the phone
         width. Hide the detail columns (Open time [col 2] + Open / Current / S-L / T-P
         [cols 5-8] — all on the bottom-nav Trade view) so Symbol / Side / Volume / Profit /
         actions fit without a side-scroll. */
      #mt5[data-tier="mobile"] .tb-positions th:nth-child(2),
      #mt5[data-tier="mobile"] .tb-positions td:nth-child(2),
      #mt5[data-tier="mobile"] .tb-positions th:nth-child(n+5):nth-child(-n+8),
      #mt5[data-tier="mobile"] .tb-positions td:nth-child(n+5):nth-child(-n+8) { display:none; }

      /* ── MOBILE pass-2: touch targets (≥44px) + overflow/out-of-view fixes ───────────
         From a real-device pass: "elements out of view, buttons too small, elements
         running off-screen". Below: every interactive control reaches a ~44px tap target,
         inputs/selects use 16px (stops iOS focus-zoom), and the things that overran the
         viewport are contained. Mobile-only (#mt5[data-tier="mobile"]) → desktop/tablet
         untouched. */

      /* 16px form controls — below 16px iOS zooms the page on focus */
      #mt5[data-tier="mobile"] input, #mt5[data-tier="mobile"] select, #mt5[data-tier="mobile"] textarea { font-size:16px; }

      /* OUT-OF-VIEW #1 — the status bar would auto-flow BELOW the bottom-nav and clip
         (nowrap/overflow:hidden/24px). Its info lives in the chart / quotes / trade. */
      #mt5[data-tier="mobile"] .statusbar { display:none; }

      /* OUT-OF-VIEW #2 — the drawing overlays render desktop-sized (.dtb 28px buttons,
         .omp 210px) and overlap the chart on a phone. Hide until a touch-native drawing
         UI exists (queued); drawing stays available on desktop + tablet, and existing
         drawings still render on the mobile chart. */
      #mt5[data-tier="mobile"] .dtb, #mt5[data-tier="mobile"] .omp { display:none; }
      /* press-and-hold the chart reveals the drawing toolbar (touch-sized); ✓ Done dismisses */
      #mt5[data-tier="mobile"][data-draw="open"] .dtb { display:flex; }
      #mt5[data-tier="mobile"] .dtb-btn { width:40px; height:40px; }
      #mt5[data-tier="mobile"] .dtb-swatch { width:18px; height:18px; }
      /* The desktop collapse (floating ✎) + drag-grip/collapse header STRAND the toolbar on
         a phone (tap ✎ with the bar hidden → gone, no way back). On mobile the bar is always
         shown via data-draw and dismissed with ✓ Done — so hide both affordances (Item 4). */
      #mt5[data-tier="mobile"] .dtb-show, #mt5[data-tier="mobile"] .dtb-head { display:none; }
      #mt5[data-tier="mobile"] .m-draw-done { position:absolute; top:8px; right:8px; z-index:8;
        background:var(--accent); color:var(--on-accent); border:0; border-radius:9px; padding:10px 16px;
        font-size:13px; font-weight:700; box-shadow:0 4px 14px var(--shadow); }

      /* OUT-OF-VIEW #3 — keep the toolbar from pushing New Order / Indicators off-screen:
